<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hüppa! · Korduse mäng</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf5e6;color:#193f3b;font-family:'Trebuchet MS',system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;min-height:48px;font-weight:800}button:focus-visible,input:focus-visible{outline:4px solid #ed8c34;outline-offset:4px}button:disabled{opacity:.6;cursor:default}main{max-width:940px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.badge{background:#e6ecd3;border-radius:30px;padding:10px 18px;font-weight:800}h1{text-align:center;font-size:clamp(36px,7vw,62px);margin:30px 0 4px;letter-spacing:-2px}h1 span{color:#ee7946}.sub{text-align:center;font-size:18px;margin:0 0 22px}.pond{position:relative;background:#9eddd8;border-radius:32px;padding:90px 30px 40px;overflow:hidden;box-shadow:0 10px 0 #70c3be}.cloud{position:absolute;top:10px;font-size:42px;opacity:.9}.cloud.a{left:30px}.cloud.b{right:30px}.bubble{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:#fffcef;padding:12px 22px;border-radius:20px;white-space:nowrap;font-weight:bold}.path{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;position:relative}.lily{position:relative;aspect-ratio:1;border-radius:50%;background:#60b954;box-shadow:0 6px 0 #429946;display:grid;place-items:center}.lily:after{content:'';position:absolute;right:-1px;top:0;border-top:14px solid #9eddd8;border-left:14px solid transparent}.lily.past{background:#88c976}.lily.target{background:#f4d367;box-shadow:0 6px 0 #d1ad3f}.actor{font-size:clamp(26px,5vw,46px);z-index:1;filter:drop-shadow(0 3px 1px #326b4425)}.hop{animation:hop .44s ease-out}.spark{animation:spark .65s ease-in-out infinite alternate}.numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;text-align:center;font-weight:800;color:#246b66;font-size:12px;margin-top:16px}.deck{background:white;border-radius:28px;padding:24px;margin:30px 0 0;display:flex;align-items:center;gap:24px;box-shadow:0 5px 0 #e8e1ce}.program{flex:1;background:#eee7ff;border:3px solid #a58adb;border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.word{font-size:21px;font-weight:800;color:#614791}.picker{display:flex;align-items:center;gap:8px}.picker button{width:44px;border-radius:12px;background:#d9cbf5;color:#614791;font-size:25px}.picker input{width:40px;border:0;background:transparent;text-align:center;font-size:26px;font-weight:900;color:#614791;appearance:textfield}.picker input::-webkit-inner-spin-button{appearance:none}.command{background:white;border-radius:12px;padding:12px;font-size:24px;white-space:nowrap}.go{background:#f68d52;border-radius:18px;color:#493118;box-shadow:0 5px 0 #d96935;padding:18px 26px;font-size:20px}.go:hover:not(:disabled){background:#ffa365;transform:translateY(-2px)}.feedback{text-align:center;min-height:34px;font-weight:800;font-size:20px;margin:26px 0 10px}.bottom{display:flex;justify-content:center;gap:12px}.reset{background:transparent;color:#59746c;border-radius:14px;padding:12px 18px}.next{background:#265f51;color:white;border-radius:16px;padding:14px 24px}.lesson{text-align:center;font-size:15px;color:#65766e;margin-top:24px}.dots{display:flex;gap:7px}.dot{width:12px;height:12px;border-radius:50%;background:#d8dacb}.dot.active{background:#ee7946}.dot.done{background:#56a67a}.confetti{position:fixed;pointer-events:none;font-size:28px;top:-40px;z-index:5;animation:fall 1.8s ease-in forwards}[hidden]{display:none!important}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-35px) rotate(-10deg)}}@keyframes spark{to{transform:scale(1.2) rotate(12deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}@media(max-width:650px){main{padding:18px 12px}.pond{padding:85px 12px 30px}.path,.numbers{gap:4px}.deck{flex-direction:column;padding:18px;gap:16px}.program{justify-content:center;width:100%;gap:10px;padding:14px}.go{width:100%}.bubble{font-size:15px;padding:12px 15px}.cloud{font-size:27px;top:6px}.cloud.a{left:10px}.cloud.b{right:10px}.lily:after{border-top-width:9px;border-left-width:9px}.badge{padding:8px 12px;font-size:14px}h1{margin-top:25px}.feedback{font-size:18px}.sub{font-size:16px}.word{font-size:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.path{grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(5,1fr);gap:8px;max-width:690px;margin:auto}.pond{padding:78px 30px 26px}.lily{min-width:0}.water{aspect-ratio:1;display:grid;place-items:center;color:#62b5b0;font-size:20px}.actor{font-size:clamp(23px,4.6vw,43px)}.command{width:100%;display:flex;flex-wrap:wrap;gap:9px;background:transparent;padding:0}.cmd{background:white;color:#614791;font-size:25px;border-radius:12px;min-width:54px;min-height:48px;position:relative}.cmd.active{background:#ffca85;color:#493118;box-shadow:0 0 0 3px #ed8c34}.cmd small{display:block;font-size:10px;font-weight:normal}.program{max-width:600px}.deck{align-items:center}.lesson{min-height:22px}.start-mark{position:absolute;bottom:1px;font-size:9px;color:#234b2a}.bubble{max-width:80%;white-space:normal;text-align:center}.dots{gap:5px}@media(max-width:650px){.path{gap:5px}.pond{padding:80px 9px 20px}.water{font-size:13px}.lily:after{border-top-width:7px;border-left-width:7px}.actor{font-size:clamp(20px,6vw,36px)}.cmd{min-width:48px}.logo{font-size:22px}.start-mark{font-size:7px}.bubble{font-size:14px}.program{justify-content:flex-start}.command{justify-content:center}}
@media(max-width:650px){.dots{display:grid;grid-template-columns:repeat(5,10px);gap:5px}.dot{width:10px;height:10px}}
</style></head><body><main><header><div class="logo">🐸 Hüppa!</div><div class="dots" aria-label="Edenemine"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="badge" id="level">1 / 10</div></header><h1>Väike konn. <span>Suur seiklus!</span></h1><p class="sub">Korda käske. Leia tee täheni! ⭐</p><section class="pond" aria-label="Mänguväli"><span class="cloud a" aria-hidden="true">☁️</span><span class="cloud b" aria-hidden="true">☁️</span><div class="bubble" id="bubble">Mitu hüpet täheni?</div><div class="path" id="path" role="img"></div></section><section class="deck" aria-label="Sinu programm"><div class="program"><label class="word" for="count">Korda</label><div class="picker"><button id="minus" aria-label="Vähenda korduste arvu">−</button><input id="count" type="number" min="1" max="8" value="1" aria-label="Korduste arv"><button id="plus" aria-label="Suurenda korduste arvu">+</button></div><span class="word">korda</span><div class="command" id="command" aria-label="Korduse käsud"></div></div><button class="go" id="run">▶ Hüppa!</button></section><div class="feedback" id="feedback" role="status" aria-live="polite">👆 Sina juhid konna!</div><div class="bottom"><button class="reset" id="reset">↺ Proovi uuesti</button><button class="next" id="next" hidden>Edasi →</button></div><p class="lesson" id="lesson">Kordus = sama tegevus mitu korda.</p></main><script>
'use strict';
const $=id=>document.getElementById(id);
const dirs=[{icon:'→',dx:1,dy:0,name:'paremale'},{icon:'↓',dx:0,dy:1,name:'alla'},{icon:'←',dx:-1,dy:0,name:'vasakule'},{icon:'↑',dx:0,dy:-1,name:'üles'}];
const missions=[
 {start:[0,4],solution:[0],answer:3,initial:[0],editable:false,title:'1. Esimesed hüpped',hint:'Mitu hüpet täheni?',extra:[[4,4],[5,4],[6,4],[7,4],[8,4]]},
 {start:[0,4],solution:[0,3],answer:3,initial:[0,3],editable:false,title:'2. Trepp',hint:'Korda: paremale → üles ↑',extra:[[4,1],[4,0]]},
 {start:[0,4],solution:[0,0,3],answer:2,initial:[0,0,3],editable:false,title:'3. Pikad astmed',hint:'Ühes korduses on 3 hüpet!',extra:[[5,2],[6,2],[6,1]]},
 {start:[0,0],solution:[0,1],answer:3,initial:[0,0],editable:true,title:'4. Vali suunad',hint:'Puuduta nooli ja vali suunad!',extra:[[2,0],[3,0],[1,2]]},
 {start:[0,3],solution:[0,3,0,1],answer:2,initial:[0,0,0,0],editable:true,title:'5. Siksak',hint:'Leia korduv muster! Muuda nooli.',extra:[[0,2],[0,1],[1,1],[2,1],[3,1],[4,1],[5,3]]},
 {start:[8,3],solution:[2,3,2,1],answer:3,initial:[0,0,0,0],editable:true,title:'6. Tagurpidi siksak',hint:'Seekord ootab täht vasakul!',extra:[[8,2],[8,1],[7,1],[6,1],[1,3]]},
 {start:[0,4],solution:[0,3,3,0,1],answer:3,initial:[0,0,0,0,0],editable:true,title:'7. Kõrged künkad',hint:'Leia viie hüppe muster!',extra:[[0,3],[0,2],[3,4],[7,1],[7,0]]},
 {start:[8,0],solution:[2,1,1,2,3,3],answer:3,initial:[0,0,0,0,0,0],editable:true,title:'8. Sügavad orud',hint:'Alla, ümber ja tagasi üles!',extra:[[8,1],[8,2],[5,3],[3,3],[1,0]]},
 {start:[0,4],solution:[0,3,0,1,0,3,3],answer:2,initial:[0,0,0,0,0,0,0],editable:true,title:'9. Mäetipp',hint:'Siksak viib aina kõrgemale!',extra:[[0,3],[2,2],[3,4],[5,4],[7,0],[8,0]]},
 {start:[0,3],solution:[0,3,0,1,0,3,0,1],answer:2,initial:[0,0,0,0,0,0,0,0],editable:true,title:'10. Suur finaal',hint:'Kaheksa noolt. Üks korduv seiklus!',extra:[[0,2],[0,1],[2,1],[4,1],[6,1],[8,1],[8,4]]}
];
function key(x,y){return x+','+y}
function layout(m){let [x,y]=m.start;const cells=new Set([key(x,y)]);for(let i=0;i<m.answer;i++)for(const d of m.solution){x+=dirs[d].dx;y+=dirs[d].dy;cells.add(key(x,y))}for(const [a,b] of m.extra)cells.add(key(a,b));return {cells,goal:[x,y]}}
let level=0,pos=[0,4],program=[],visited=new Set(),busy=false,token=0,completed=0,hops=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function readCount(){const n=Number($('count').value);return Number.isInteger(n)&&n>=1&&n<=8?n:null}
function lock(b){busy=b;['run','count','plus','minus'].forEach(id=>$(id).disabled=b);document.querySelectorAll('.cmd').forEach(btn=>btn.disabled=b||!missions[level].editable)}
function draw(hop=false){const m=missions[level],map=layout(m);$('path').replaceChildren();for(let y=0;y<5;y++)for(let x=0;x<9;x++){const cell=document.createElement('div'),here=x===pos[0]&&y===pos[1],goal=x===map.goal[0]&&y===map.goal[1];cell.setAttribute('aria-hidden','true');if(map.cells.has(key(x,y))){cell.className='lily'+(visited.has(key(x,y))?' past':'')+(goal?' target':'');const actor=document.createElement('span');actor.className='actor'+(here&&hop?' hop':goal&&!here?' spark':'');actor.textContent=here?'🐸':goal?'⭐':'';cell.append(actor);if(x===m.start[0]&&y===m.start[1]&&!here){const label=document.createElement('span');label.className='start-mark';label.textContent='ALGUS';cell.append(label)}}else{cell.className='water';cell.textContent=(x+y)%4===0?'≈':''} $('path').append(cell)}$('path').setAttribute('aria-label',`Konn: veerg ${pos[0]+1}, rida ${pos[1]+1}. Täht: veerg ${map.goal[0]+1}, rida ${map.goal[1]+1}.`)}
function renderProgram(active=-1){$('command').replaceChildren();program.forEach((d,i)=>{const btn=document.createElement('button');btn.className='cmd'+(i===active?' active':'');btn.type='button';btn.textContent=dirs[d].icon;btn.setAttribute('aria-label',`Käsk ${i+1}: hüppa ${dirs[d].name}`);btn.disabled=busy||!missions[level].editable;if(missions[level].editable){const small=document.createElement('small');small.textContent='muuda';btn.append(small);btn.onclick=()=>{if(busy)return;program[i]=(program[i]+1)%4;invalidate();renderProgram()}}$('command').append(btn)})}
function invalidate(){$('next').hidden=true;$('feedback').textContent='Valmis? Hüppa! 🐸';$('lesson').textContent='Iga nool = üks hüpe.'}
function setup(){token++;busy=false;const m=missions[level];pos=[...m.start];visited=new Set();program=[...m.initial];completed=0;hops=0;$('count').value='1';$('level').textContent=`${level+1} / ${missions.length}`;$('bubble').textContent=m.hint;$('feedback').textContent=m.title;$('lesson').textContent=m.editable?'Puuduta noolt, et suunda muuta.':'Kogu noolerida kordub.';$('next').hidden=true;document.querySelectorAll('.dot').forEach((dot,i)=>dot.className='dot'+(i===level?' active':i<level?' done':''));renderProgram();lock(false);draw()}
function change(d){const n=readCount()??1;$('count').value=String(Math.max(1,Math.min(8,n+d)));invalidate()}
function celebrate(){if(reduced)return;for(let i=0;i<18;i++){const c=document.createElement('span');c.className='confetti';c.textContent=['⭐','🌸','✨'][i%3];c.style.left=Math.random()*100+'%';c.style.animationDelay=Math.random()*.35+'s';c.setAttribute('aria-hidden','true');document.body.append(c);setTimeout(()=>c.remove(),2500)}}
async function run(){if(busy)return;const n=readCount();if(n===null){$('feedback').textContent='Vali täisarv 1–8.';return}const m=missions[level],map=layout(m),commands=[...program],mine=++token;pos=[...m.start];visited=new Set();hops=0;completed=0;draw();lock(true);$('next').hidden=true;let blocked=false;
outer:for(let i=0;i<n;i++){for(let j=0;j<commands.length;j++){renderProgram(j);$('feedback').textContent=`Kordus ${i+1} / ${n} · hüpe ${j+1} / ${commands.length}`;await new Promise(r=>setTimeout(r,reduced?20:580));if(mine!==token)return;const d=dirs[commands[j]],x=pos[0]+d.dx,y=pos[1]+d.dy;if(!map.cells.has(key(x,y))){blocked=true;break outer}visited.add(key(...pos));pos=[x,y];hops++;draw(true)}completed++}
if(mine!==token)return;lock(false);renderProgram();const won=!blocked&&completed===n&&pos[0]===map.goal[0]&&pos[1]===map.goal[1];$('lesson').textContent=`Tehtud: ${hops} hüpet · ${completed} / ${n} tervet kordust.`;
if(won){celebrate();$('feedback').textContent=level===missions.length-1?'🏆 Korduste meister!':'⭐ Täht käes!';$('next').hidden=false;$('next').textContent=level===missions.length-1?'Mängi uuesti ↻':'Edasi →'}else if(blocked){$('feedback').textContent='💧 Siin on vesi! Muuda oma programmi.'}else{$('feedback').textContent='🐸 Täht jäi mujale! Proovi uuesti.'}}
$('minus').onclick=()=>change(-1);$('plus').onclick=()=>change(1);$('count').oninput=()=>{if(!busy)invalidate()};$('run').onclick=run;$('reset').onclick=setup;$('next').onclick=()=>{if(busy||$('next').hidden)return;level=(level+1)%missions.length;setup();$('run').focus()};setup();
</script></body></html>
