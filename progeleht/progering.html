<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROGERING</title>
  <style>
    :root {
      --taust: #f0f8ff;
      --pealkiri: #ff6b6b;
      --aktiivne: #4ecdc4;
      --kaardi-pealkirja-taust: #ffffff;
      --kaardi-pealkirja-tekst: #333333;
      --kaardi-suurus: 280px;
      --font: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--taust);
      color: #333;
      font-family: var(--font);
      text-align: center;
    }
    button { font: inherit; cursor: pointer; }
    header {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      color: var(--pealkiri);
      font-size: clamp(2rem, 6vw, 3.5rem);
    }
    .stars {
      padding: 10px 16px;
      background: white;
      border: 3px solid #feca57;
      border-radius: 20px;
      font-size: 23px;
      font-weight: bold;
    }
    .notice {
      max-width: 1050px;
      margin: 18px auto;
      color: #555;
      font-weight: bold;
    }
    .board {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, var(--kaardi-suurus)), 1fr)
      );
      gap: 24px;
    }
    .card {
      position: relative;
      min-height: 270px;
      overflow: hidden;
      background: white;
      border: 6px solid #ccc;
      border-radius: 20px;
      box-shadow: 0 6px 12px #0002;
      cursor: pointer;
      transition: transform .2s;
    }
    .card:hover { transform: scale(1.03); }
    .card img {
      display: block;
      width: 100%;
      height: 207px;
      object-fit: cover;
      object-position: top;
      background: #eee;
    }
    .card-title {
      min-height: 57px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      background: var(--kaardi-pealkirja-taust);
      color: var(--kaardi-pealkirja-tekst);
      font-size: 20px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 5px 10px;
      background: #fffffff0;
      border-radius: 14px;
      font-weight: bold;
    }
    .task-button, .answer, .primary {
      padding: 13px 18px;
      border: 3px solid var(--aktiivne);
      border-radius: 13px;
      background: white;
      font-weight: bold;
    }
    .task-button { margin: 8px; }
    .answer {
      display: block;
      width: 100%;
      margin: 8px 0;
    }
    .answer:disabled, .task-button:disabled {
      opacity: .6;
      cursor: default;
    }
    .primary {
      width: 100%;
      margin-top: 12px;
      background: var(--aktiivne);
      color: white;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: #0009;
    }
    .overlay.open { display: flex; }
    .modal {
      position: relative;
      width: 100%;
      max-width: 530px;
      max-height: 90vh;
      overflow: auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      text-align: left;
    }
    .modal h2 { margin: 0 35px 20px 0; }
    .close {
      position: absolute;
      top: 8px;
      right: 14px;
      border: 0;
      background: none;
      font-size: 30px;
    }
  </style>
</head>
<body>
  <header>
    <div class="stars">⭐ <span id="starCount">0</span></div>
    <h1>Progering</h1>
  </header>

  <p class="notice" id="notice"></p>
  <button class="task-button" id="tasksButton" hidden>
    ⭐ Teeni tähti
  </button>
  <main class="board" id="board"></main>

  <div class="overlay" id="messageModal">
    <div class="modal">
      <button class="close" type="button" data-close>×</button>
      <h2>🔒 VEEL LUKUS</h2>
      <p id="messageText"></p>
      <button class="primary" type="button" data-close>SULGE</button>
    </div>
  </div>

  <div class="overlay" id="tasksModal">
    <div class="modal">
      <button class="close" type="button" data-close>×</button>
      <h2>Teeni tähti ⭐</h2>
      <div id="taskList"></div>
    </div>
  </div>

  <div class="overlay" id="quizModal">
    <div class="modal">
      <button class="close" type="button" data-close>×</button>
      <h2 id="question"></h2>
      <div id="answers"></div>
      <p id="feedback" role="status"></p>
    </div>
  </div>

        {
          id: "kood",
          nimi: "KOODI MÄNG",
          link: "https://www.safekidgames.com/pin-solver/",
          alguseMang: false,
          aare: "#67bdff",

          klassikalineHind: 3,
          taheHind: 3
        }

        // Lisa järgmine mäng siia. Ära unusta eelmise järel koma!
        // {
        //   id: "uus_mang",
        //   nimi: "UUS MÄNG",
        //   link: "https://example.com",
        //   alguseMang: false,
        //   aare: "#a29bfe",
        //   klassikalineTyyp: "free",
        //   taheHind: 0
        // }
      ],

      // Lisaülesanded annavad tähti režiimi "custom" mängude avamiseks.
      // Soovi korral võid neid kasutada ka režiimis "classic".
      lisaulesanded: [
        // {
        //   id: "arvutamine",
        //   nimi: "Arvuta peast",
        //   tahti: 1,
        //   kusimus: {
        //     tekst: "Kui palju on 3 + 4?",
        //     vastused: ["6", "7", "8"],
        //     oigeVastuseIndex: 1
        //   }
        // }
      ]
    };
    /* ================= ÕPETAJA SEADETE LÕPP ================= */

    // Edenemine elab ainult selle lehe avamise ajal.
    // Värskendamisel alustavad tähed ja mängude avamised nullist.
    const $ = id => document.getElementById(id);
    let edenemine = {
      tahed: 0,
      mangitud: [],
      kusimusegaAvatud: [],
      tehtudUlesanded: []
    };

    let aktiivneKusimus = null;
    let vastatud = false;

    function avaModal(id) {
      $(id).classList.add("open");
    }

    function sulgeModalid() {
      document.querySelectorAll(".overlay").forEach(modal => {
        modal.classList.remove("open");
      });
      aktiivneKusimus = null;
    }

    document.querySelectorAll("[data-close]").forEach(nupp => {
      nupp.addEventListener("click", sulgeModalid);
    });

    function kujunda() {
      const k = SEADED.kujundus;
      const style = document.documentElement.style;
      style.setProperty("--taust", k.taust);
      style.setProperty("--pealkiri", k.pealkiri);
      style.setProperty("--aktiivne", k.aktiivneNupp);
      style.setProperty("--kaardi-pealkirja-taust", k.kaardiPealkirjaTaust);
      style.setProperty("--kaardi-pealkirja-tekst", k.kaardiPealkirjaTekst);
      style.setProperty("--kaardi-suurus", k.kaardiSuurus);
      style.setProperty("--font", k.font);
    }

    function manguOlek(mang) {
      switch (SEADED.reziim) {
        case "free":
          return { avatud: true };

        case "count":
          return {
            avatud: mang.alguseMang ||
              edenemine.mangitud.length >= SEADED.vajalikMangudeArv,
            tyyp: "count"
          };

        case "custom":
          return {
            avatud: edenemine.tahed >= (mang.taheHind || 0),
            tyyp: "stars",
            hind: mang.taheHind || 0
          };

        case "classic":
          if (mang.klassikalineTyyp === "quiz") {
            return {
              avatud: edenemine.kusimusegaAvatud.includes(mang.id),
              tyyp: "quiz"
            };
          }
          if (mang.klassikalineTyyp === "premium") {
            return {
              avatud: edenemine.tahed >= (mang.klassikalineHind || 0),
              tyyp: "stars",
              hind: mang.klassikalineHind || 0
            };
          }
          return { avatud: true };

        default:
          return { avatud: true };
      }
    }

    function teade(tekst) {
      $("messageText").textContent = tekst;
      avaModal("messageModal");
    }

    function avaMang(mang) {
      const olek = manguOlek(mang);

      if (!olek.avatud) {
        if (olek.tyyp === "quiz" && mang.kusimus) {
          alustaKusimust(mang.kusimus, { tyyp: "mang", mang });
        } else if (olek.tyyp === "count") {
          teade(
            `MÄNGI VÄHEMALT ${SEADED.vajalikMangudeArv} ROOSAT MÄNGU, ET TEISED AVANEKS. ` +
            `Praegu avatud: ${edenemine.mangitud.length}.`
          );
        } else {
          teade(
            `Selle mängu avamiseks on vaja ${olek.hind} ⭐. ` +
            `Sul on ${edenemine.tahed} ⭐.`
          );
        }
        return;
      }

      // Brauser võib uue akna blokeerida, kui see avatakse viitega.
      // Seepärast avame mängu kohe kasutaja klõpsu ajal.
      window.open(mang.link, "_blank", "noopener,noreferrer");

      if (
        SEADED.reziim === "count" &&
        mang.alguseMang &&
        !edenemine.mangitud.includes(mang.id)
      ) {
        edenemine.mangitud.push(mang.id);
        kuva();
      }
    }

    function kuva() {
      kujunda();
      $("starCount").textContent =
  edenemine.tahed +
  (SEADED.reziim === "count" ? edenemine.mangitud.length : 0);

      if (SEADED.reziim === "count") {
        $("notice").textContent =
          `MÄNGI ${SEADED.vajalikMangudeArv} ERINEVAT ROOSA ÄÄREGA ` +
          `MÄNGU. AVATUD: ${edenemine.mangitud.length}/` +
          `${SEADED.vajalikMangudeArv}.`;
      } else if (SEADED.reziim === "free") {
        $("notice").textContent = "Kõik mängud on avatud.";
      } else if (SEADED.reziim === "custom") {
        $("notice").textContent =
          "Teeni lisaülesannetega tähti ja ava nende abil mänge.";
      } else {
        $("notice").textContent =
          "Igal mängul on oma avamise tingimus.";
      }

      $("tasksButton").hidden =
        !SEADED.lisaulesanded.length ||
        !["custom", "classic"].includes(SEADED.reziim);

      const board = $("board");
      board.replaceChildren();

      for (const mang of SEADED.mangud) {
        const olek = manguOlek(mang);
        const kaart = document.createElement("div");
        kaart.className = "card";
        kaart.tabIndex = 0;
        kaart.setAttribute("role", "button");
        kaart.setAttribute(
          "aria-label",
          mang.nimi + (olek.avatud ? "" : ", lukus")
        );

        kaart.style.borderColor =
          SEADED.reziim === "count" && mang.alguseMang
            ? SEADED.kujundus.alguseManguAare
            : mang.aare;

        const pilt = document.createElement("img");
        pilt.alt = "";
        pilt.loading = "lazy";
        pilt.src =
          "https://s0.wp.com/mshots/v1/" +
          encodeURIComponent(mang.link) +
          "?w=600";

        const nimi = document.createElement("div");
        nimi.className = "card-title";
        nimi.textContent = mang.nimi;
        kaart.append(pilt, nimi);

        let mark = "";
        if (!olek.avatud) {
          if (olek.tyyp === "count") {
            mark = "🔒 " + edenemine.mangitud.length +
              "/" + SEADED.vajalikMangudeArv;
          } else if (olek.tyyp === "quiz") {
            mark = "🔒 Küsimus";
          } else {
            mark = "🔒 " + olek.hind + " ⭐";
          }
        } else if (
          SEADED.reziim === "count" &&
          edenemine.mangitud.includes(mang.id)
        ) {
          mark = "✓ TEHTUD";
        }

        if (mark) {
          const silt = document.createElement("span");
          silt.className = "badge";
          silt.textContent = mark;
          kaart.append(silt);
        }

        kaart.addEventListener("click", () => avaMang(mang));
        kaart.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            avaMang(mang);
          }
        });
        board.append(kaart);
      }
    }

    function alustaKusimust(kusimus, tegevus) {
      sulgeModalid();
      aktiivneKusimus = tegevus;
      vastatud = false;
      $("question").textContent = kusimus.tekst;
      $("feedback").textContent = "";
      $("answers").replaceChildren();

      kusimus.vastused.forEach((vastus, index) => {
        const nupp = document.createElement("button");
        nupp.className = "answer";
        nupp.type = "button";
        nupp.textContent = vastus;
        nupp.addEventListener("click", () => {
          kontrolliVastust(index, kusimus.oigeVastuseIndex, nupp);
        });
        $("answers").append(nupp);
      });

      avaModal("quizModal");
    }

    function kontrolliVastust(valitud, oige, nupp) {
      if (vastatud) return;

      if (valitud !== oige) {
        $("feedback").textContent = "Proovi uuesti!";
        nupp.style.background = "#ffb8b8";
        setTimeout(() => { nupp.style.background = ""; }, 500);
        return;
      }

      vastatud = true;
      $("answers").querySelectorAll("button").forEach(button => {
        button.disabled = true;
      });
      $("feedback").textContent = "Õige vastus! ⭐";

      const tegevus = aktiivneKusimus;

      if (tegevus.tyyp === "mang") {
        if (!edenemine.kusimusegaAvatud.includes(tegevus.mang.id)) {
          edenemine.kusimusegaAvatud.push(tegevus.mang.id);
          edenemine.tahed += 1;
        }
      } else if (
        tegevus.tyyp === "ulesanne" &&
        !edenemine.tehtudUlesanded.includes(tegevus.ulesanne.id)
      ) {
        edenemine.tehtudUlesanded.push(tegevus.ulesanne.id);
        edenemine.tahed += tegevus.ulesanne.tahti;
      }

      kuva();

      setTimeout(() => {
        sulgeModalid();
        if (tegevus.tyyp === "ulesanne") kuvaUlesanded();
        // Pärast küsimust saab mängu kaarti uuesti klõpsata.
      }, 650);
    }

    function kuvaUlesanded() {
      const nimekiri = $("taskList");
      nimekiri.replaceChildren();

      for (const ulesanne of SEADED.lisaulesanded) {
        const tehtud = edenemine.tehtudUlesanded.includes(ulesanne.id);
        const nupp = document.createElement("button");
        nupp.className = "answer";
        nupp.type = "button";
        nupp.disabled = tehtud;
        nupp.textContent =
          `${tehtud ? "✓ " : ""}${ulesanne.nimi} · ` +
          `${tehtud ? "Tehtud" : ulesanne.tahti + " ⭐"}`;
        nupp.addEventListener("click", () => {
          alustaKusimust(ulesanne.kusimus, {
            tyyp: "ulesanne",
            ulesanne
          });
        });
        nimekiri.append(nupp);
      }

      avaModal("tasksModal");
    }

    $("tasksButton").addEventListener("click", kuvaUlesanded);
    kuva();
  </script>
</body>
</html>
